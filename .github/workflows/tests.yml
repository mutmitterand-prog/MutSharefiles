name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  serveur:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests du serveur
        working-directory: desktop-server
        run: |
          npm ci
          npm test

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Tests du lanceur Android
        run: node mobile/test/pcAddress.test.mjs
