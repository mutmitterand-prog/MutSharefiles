name: Compiler EXE Windows TRANSFERT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Générer l'installateur Windows EXE
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances de l'interface
        run: npm ci

      - name: Construire l'interface web
        run: npm run build

      - name: Préparer les fichiers de l'application Windows
        run: node desktop-app/scripts/prepare.mjs
        env:
          APP_VERSION: 1.0.12

      - name: Installer les dépendances Windows/Electron
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Construire l'installateur EXE
        working-directory: desktop-app
        run: npm run dist

      - name: Publier l'installateur EXE
        uses: actions/upload-artifact@v4
        with:
          name: TRANSFERT-Windows-1.0.12-EXE
          path: desktop-app/dist-installer/*.exe
          if-no-files-found: error
          retention-days: 14
