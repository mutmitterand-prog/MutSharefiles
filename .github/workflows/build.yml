name: Compiler APK et installateur Windows

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main, master]
    tags: ['v*']            # une étiquette v1.0.1 publie aussi une Release avec les deux fichiers

permissions:
  contents: write           # nécessaire pour créer la Release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Construire l'interface web
        run: |
          npm ci
          npm run build
      - name: Préparer l'application Windows
        working-directory: desktop-app
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          node scripts/prepare.mjs
          npm install --no-audit --no-fund
      - name: Créer l'installateur (.exe)
        working-directory: desktop-app
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TRANSFERT-Windows-installateur
          path: desktop-app/dist-installer/TRANSFERT-Setup-*.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
          node test/pcAddress.test.mjs
      - name: Générer et adapter le projet Android
        working-directory: mobile
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Compiler l'APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nommer l'APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/TRANSFERT-${{ needs.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TRANSFERT-Android-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
