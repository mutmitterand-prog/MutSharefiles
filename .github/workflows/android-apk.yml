name: Compiler APK Android TRANSFERT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    - master
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Générer l'APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances Android/Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Générer le projet Android Capacitor
        working-directory: mobile
        run: npx cap add android

      - name: Appliquer le plugin USB OTG et les réglages Android
        working-directory: mobile
        env:
          APP_VERSION: 1.0.12
          APP_VERSION_CODE: 12
        run: node scripts/patch-android.mjs

      - name: Synchroniser Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Compiler l'APK Debug
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: TRANSFERT-Android-1.0.12-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
