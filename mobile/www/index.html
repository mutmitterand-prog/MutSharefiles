<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>TRANSFERT</title>
  <link rel="stylesheet" href="launcher.css" />
</head>
<body>
  <main id="home">
    <h1>TRANSFERT</h1>
    <p class="lead">Envoyez et recevez des fichiers entre ce téléphone et votre PC, sur le même Wi-Fi.</p>
    <button id="scan" class="primary">Scanner le QR code du PC</button>
    <p id="message" role="status"></p>

    <section id="saved" hidden>
      <h2>Mes ordinateurs</h2>
      <ul id="pc-list"></ul>
    </section>

    <details>
      <summary>Saisir l'adresse à la main</summary>
      <form id="manual" autocomplete="off">
        <input id="manual-url" type="text" inputmode="url" placeholder="http://192.168.1.20:PORT" aria-label="Adresse du PC" />
        <button type="submit">Ouvrir</button>
      </form>
    </details>
  </main>

  <section id="scanner" hidden>
    <video id="video" playsinline muted></video>
    <canvas id="canvas" hidden></canvas>
    <p class="hint">Visez le QR code affiché sur l'écran du PC.</p>
    <button id="scan-cancel">Annuler</button>
  </section>

  <script src="jsQR.js"></script>
  <script src="pcAddress.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
